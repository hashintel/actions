# Centralized Renovate workflow
#
# Reusable workflow that runs Renovate with a centrally pinned version, and with
# an installation token minted from a key that only Vault can use.
#
# Minting and running are separate jobs. Only the mint job holds
# `id-token: write`, and it installs nothing, so dependency code in the
# Renovate job cannot reach Vault to sign fresh App JWTs. The token crosses
# the job boundary encrypted: GitHub drops masked values from job outputs, so
# the plaintext could not make the trip anyway, and the ciphertext is useless
# without `RENOVATE_TOKEN_ENC_KEY`. Both jobs run in the `Renovate` environment
# of the repository Renovate runs for, which holds the secrets and the
# Cloudflare Access client ID, and the Renovate job revokes the token once
# Renovate is done.
name: Update dependencies

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      repoCache:
        description: "Reset or disable the cache?"
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        description: "Override default log level"
        type: choice
        default: info
        options:
          - "debug"
          - "info"
          - "warn"
          - "error"
      overrideSchedule:
        description: "Override all schedules"
        type: boolean
        default: false
      dryRun:
        description: "Dry run mode"
        type: choice
        default: disabled
        options:
          - disabled
          - extract
          - lookup
          - full
  workflow_call:
    inputs:
      repoCache:
        description: "Reset or disable the cache?"
        type: string
        default: enabled
      logLevel:
        description: "Override default log level"
        type: string
        default: info
      overrideSchedule:
        description: "Override all schedules"
        type: boolean
        default: false
      dryRun:
        description: "Dry run mode"
        type: string
        default: disabled
    secrets:
      CF_ACCESS_CLIENT_SECRET:
        description: >-
          Client secret of the Cloudflare Access service token for the staging
          Vault, whose client ID is the variable `CF_ACCESS_CLIENT_ID`. Both
          belong in the caller's `Renovate` environment, which the mint job runs
          in. A called workflow receives only the secrets its caller names, so
          each caller names this one, and the mint job gets the environment's
          value.
        required: true
      RENOVATE_TOKEN_ENC_KEY:
        description: >-
          Passphrase that encrypts the installation token on its way from the
          mint job to the Renovate job. It belongs in the caller's `Renovate`
          environment, and each caller names it like `CF_ACCESS_CLIENT_SECRET`.
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  mint-token:
    name: Mint token
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Holds both secrets and the client ID. The README requires its deployment
    # branches to be limited to `main`, so no job of a pull request can read
    # the secrets.
    environment:
      name: Renovate
      deployment: false
    permissions:
      contents: read
      # Signs the OIDC token that Vault exchanges for the App installation token.
      id-token: write
    # Shares the renovate group so the hour-long token is minted only once the
    # run can proceed, not while queued behind a still-running Renovate job.
    concurrency:
      cancel-in-progress: false
      group: renovate
    outputs:
      token-ciphertext: ${{ steps.encrypt.outputs.encrypted_value }}

    steps:
      # A value the environment lacks arrives empty, and would otherwise
      # surface as a Cloudflare rejection of the Vault login or after minting.
      - name: Check the Renovate environment
        env:
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RENOVATE_TOKEN_ENC_KEY: ${{ secrets.RENOVATE_TOKEN_ENC_KEY }}
        run: |
          for name in CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET RENOVATE_TOKEN_ENC_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Renovate environment::${name} is empty; set it in the repository's Renovate environment"
              exit 1
            fi
          done

      - name: Get token
        id: app-token
        uses: $/.github/actions/github-app-token
        with:
          vault-address: ${{ vars.VAULT_STAGE_ADDR }}
          vault-role: ci-renovate
          app-id: "4505109"
          transit-key: github-app-hash-dependencies
          repository: ${{ github.repository }}
          cf-access-client-id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # The token is already masked, and GitHub silently drops masked values
      # from job outputs, so only ciphertext can cross the job boundary.
      - name: Encrypt token
        id: encrypt
        uses: $/.github/actions/encrypt-secret
        with:
          value: ${{ steps.app-token.outputs.token }}
          encryption_key: ${{ secrets.RENOVATE_TOKEN_ENC_KEY }}

  renovate:
    name: Renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: mint-token
    environment:
      name: Renovate
      deployment: false
    # No `id-token` here: compromised dependency code in this job gets at most
    # the hour-long installation token scoped to the calling repository.
    permissions:
      # Lets dawidd6/action-download-artifact find the cache of an earlier run.
      actions: read
      contents: read
    concurrency:
      cancel-in-progress: false
      group: renovate
    env:
      dry_run: ${{ inputs.dryRun || 'disabled' }}
      repo_cache: ${{ inputs.repoCache || 'enabled' }}

    steps:
      # First step, so the plaintext is masked before anything else runs.
      - name: Decrypt token
        id: app-token
        uses: $/.github/actions/decrypt-secret
        with:
          encrypted_value: ${{ needs.mint-token.outputs.token-ciphertext }}
          encryption_key: ${{ secrets.RENOVATE_TOKEN_ENC_KEY }}

      - name: Install Renovate
        uses: $/.github/actions/install-renovate

      - name: Download renovate cache
        uses: dawidd6/action-download-artifact@v28
        if: ${{ env.repo_cache != 'disabled' }}
        continue-on-error: true
        with:
          name: renovate-cache
          path: cache-download

      - name: Extract renovate cache
        if: ${{ env.repo_cache != 'disabled' }}
        run: |
          if [ ! -d cache-download ]; then
            echo "No cache found."
            exit 0
          fi

          mkdir -p /tmp/renovate/cache/renovate/repository
          tar -xzf cache-download/renovate_cache.tar.gz -C /tmp/renovate/cache/renovate/repository

      - name: Run Renovate
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.value }}
          RENOVATE_FORCE: ${{ inputs.overrideSchedule && '{"schedule":null}' || '' }}
          RENOVATE_DRY_RUN: ${{ env.dry_run == 'disabled' && 'null' || env.dry_run }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REPOSITORY_CACHE: ${{ env.repo_cache }}
          RENOVATE_ALLOW_SCRIPTS: "false"
          RENOVATE_IGNORE_SCRIPTS: "true"
        run: renovate

      - name: Compress renovate cache
        if: ${{ env.dry_run == 'disabled' && env.repo_cache != 'disabled' }}
        run: tar -czvf renovate_cache.tar.gz -C /tmp/renovate/cache/renovate/repository .

      - name: Upload renovate cache
        uses: actions/upload-artifact@v7.0.2
        if: ${{ env.dry_run == 'disabled' && env.repo_cache != 'disabled' }}
        with:
          name: renovate-cache
          path: renovate_cache.tar.gz
          if-no-files-found: error
          retention-days: 1

      # Also when an earlier step fails or the job is cancelled: the token would
      # otherwise stay valid for the rest of its hour.
      - name: Revoke token
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.value }}
        run: gh api --method DELETE /installation/token
