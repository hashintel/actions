# Lint GitHub Actions workflows
#
# Reusable workflow that runs jactionlint over the calling repository's
# workflow and action files, fails on runner labels that GitHub moves to newer
# images (such as `ubuntu-latest`), and fails when its
# `.github/workflows/actions.lock` is missing an entry, is stale, or records a
# pin GitHub would reject at run time. The jactionlint and `gh-actions-lock`
# versions are pinned centrally.
name: Lint

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Actionlint
    runs-on: ubuntu-26.04
    # The default checkout resolves to the PR merge commit or the merge-group
    # ref; any other calling event would silently lint the base branch.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Jactionlint
        run: go run github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.6.0 --profile correctness

      # The correctness profile does not include this rule. A pinned label
      # such as `ubuntu-26.04` keeps the runner image fixed until the
      # repository changes it; `ubuntu-latest` moves to a new image when GitHub
      # decides to.
      - name: Disallow mutable runner labels
        run: go run github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.6.0 --select mutable-runner-label --strict-exit

  lockfile:
    name: Validate actions lockfile
    runs-on: ubuntu-26.04
    # Same reason as the job above: any other calling event would validate the
    # base branch.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.1
        run: gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"

      - name: Validate lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
