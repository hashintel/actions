# Lint GitHub Actions workflows
#
# Reusable workflow that runs jactionlint over the calling repository's
# workflow and action files with the `pedantic` rule profile and fails on
# findings of every level, fails on runner labels that GitHub moves to newer
# images (such as `ubuntu-latest`), fails when its
# `.github/workflows/actions.lock` is missing an entry, is stale, or records a
# pin GitHub would reject at run time, and validates its Renovate config. The
# jactionlint, `gh-actions-lock` and Renovate versions are pinned centrally.
name: Lint

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      # On this workflow's own triggers `inputs` is empty, and null equals false in an expression, so
      # a job compares `toJSON(...)` with 'false' and runs unless a caller passes false.
      run-actionlint:
        description: Run the Actionlint check. A skipped check satisfies a required status check.
        type: boolean
        default: true
      run-actions-lockfile:
        description: Run the actions lockfile check. A skipped check satisfies a required status check.
        type: boolean
        default: true
      run-renovate-config:
        description: Run the Renovate config check. A skipped check satisfies a required status check.
        type: boolean
        default: true

permissions:
  contents: read

# Inside a called workflow `github.workflow` is the caller's name, so the
# `preflight-lint` part keeps this group apart from the caller's own group.
concurrency:
  group: ${{ github.workflow }}-preflight-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The default checkout resolves to the PR merge commit or the merge-group
    # ref; any other calling event would silently lint the base branch.
    if: ${{ toJSON(inputs.run-actionlint) != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Jactionlint
        run: go run github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.6.0 --profile pedantic --strict-exit

  lockfile:
    name: Validate actions lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Same reason as the job above: any other calling event would validate the
    # base branch.
    if: ${{ toJSON(inputs.run-actions-lockfile) != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.1
        run: gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"

      - name: Validate lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  renovate:
    name: Validate Renovate config
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Same reason as the jobs above: any other calling event would validate the
    # base branch.
    if: ${{ toJSON(inputs.run-renovate-config) != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The file names Renovate reads its repository config from. A repository
      # without any of them passes, so the check can be required everywhere.
      - name: Find Renovate config
        id: config
        run: |
          for file in \
            renovate.json renovate.jsonc renovate.json5 \
            .github/renovate.json .github/renovate.jsonc .github/renovate.json5 \
            .gitlab/renovate.json .gitlab/renovate.jsonc .gitlab/renovate.json5 \
            .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5; do
            if [[ -f "${file}" ]]; then
              echo "found=true" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
          done

          if [[ -f package.json ]] && jq -e 'has("renovate")' package.json >/dev/null 2>&1; then
            echo "found=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::notice title=Validate Renovate config::No Renovate config found, skipping validation"
          echo "found=false" >>"${GITHUB_OUTPUT}"

      # `$/` resolves against this workflow's commit, not the caller's checkout.
      - name: Install Renovate
        if: ${{ steps.config.outputs.found == 'true' }}
        uses: $/.github/actions/install-renovate

      # Without arguments the validator checks every config file Renovate would
      # read. `--strict` also fails on config that Renovate would migrate.
      - name: Validate Renovate config
        if: ${{ steps.config.outputs.found == 'true' }}
        run: renovate-config-validator --strict
